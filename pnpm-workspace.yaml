  - image-size@2.0.3
  - qs@6.15.4 || 6.16.0
  - svgo@4.1.0
  - nodemailer@8.0.8 || 8.0.9 || 9.0.1 || 9.1.0 || 9.1.1
  - multer@2.3.0
  - smol-toml@1.7.1
  - ws@8.20.1 || 8.21.0
  - uuid@11.1.1
  - linkify-it@5.0.1 || 5.0.2
