  '@parcel/watcher': true
  '@swc/core': true
  cypress: true
  esbuild: true
  lmdb: true
  mongodb-memory-server: true
  msgpackr-extract: true
  nice-napi: true
  nx: true
  less: true
  unrs-resolver: true
  '@scarf/scarf': false
